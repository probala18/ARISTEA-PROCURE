services:
  # -------------------------------------------------------------
  # ARISTEA-PROCURE FastAPI Backend (Docker)
  # -------------------------------------------------------------
  - type: web
    name: aristea-procure-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sih_bis.db
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_DIR
        value: csvfiles

  # -------------------------------------------------------------
  # ARISTEA-PROCURE Next.js Frontend (Node.js)
  # -------------------------------------------------------------
  - type: web
    name: aristea-procure-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: aristea-procure-backend
          property: host
