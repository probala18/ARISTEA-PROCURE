services:
  # -------------------------------------------------------------
  # ARISTEA-PROCURE FastAPI Backend (Docker)
  # -------------------------------------------------------------
  - type: web
    name: aristea-procure-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sih_bis.db
      - key: CORS_ALLOWED_ORIGINS
        value: https://aristea-procure.vercel.app
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_DIR
        value: csvfiles

